name: Continuous Deployment (CasaOS / Home Server)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  quality-check:
    name: Pre-deployment Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=backend

      - name: Build shared package
        run: npm run build:shared

      - name: Type check (TypeScript)
        run: |
          npx tsc --noEmit --project shared/tsconfig.json
          npx tsc --noEmit --project backend/tsconfig.json
          npx tsc --noEmit --project frontend/tsconfig.json

      - name: Run unit tests
        run: npm test --workspace=backend

  deploy:
    name: Deploy to Server via SSH
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Home Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 [CI/CD] Conexión SSH establecida. Iniciando actualización..."
            
            # Definir la ruta del proyecto en el servidor
            PROJECT_DIR="${{ secrets.SERVER_PROJECT_PATH || '/DATA/AppData/gremioweb' }}"
            
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "❌ Error: El directorio $PROJECT_DIR no existe en el servidor."
              exit 1
            fi

            cd "$PROJECT_DIR"
            
            echo "📥 [CI/CD] Descargando últimos cambios desde la rama master..."
            git fetch origin master
            git reset --hard origin/master
            
            echo "⚙️ [CI/CD] Otorgando permisos a deploy.sh..."
            chmod +x deploy.sh
            
            echo "🛠️ [CI/CD] Ejecutando deploy.sh (compilación, inicio y autolimpieza)..."
            ./deploy.sh
            
            echo "🎉 [CI/CD] ¡Despliegue automático finalizado con éxito!"
