# ======================================================
# Gremio Estelar — Render Blueprint (Infrastructure as Code)
# ======================================================
# Connect your GitHub repo to Render and it will auto-detect this file.
# It deploys TWO services:
#   1. gremio-web: Express backend + Next.js frontend (monolith)
#   2. gremio-media-engine: Python/FastAPI image optimization microservice
# ======================================================

services:
  # ===== BACKEND (API + Socket.IO) =====
  # ⚠️  IMPORTANTE para el chat en tiempo real: este servicio debe correr en
  # modo API-only (RUN_BACKEND_ONLY=1) para que Express + Socket.IO escuchen
  # en el puerto público. Los rewrites de Next.js (/socket.io/* -> Express
  # interno) NO proxean WebSocket upgrades, así que en el monolito el chat
  # siempre sale "desconectado".
  - type: web
    name: gremio-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Health check path (Render will ping this)
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: RUN_BACKEND_ONLY
        value: "1"
      # Dominio público del FRONTEND (CORS/WebSocket). Ej: https://gremio-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false
      # CORS extra si hay varios dominios (separados por coma)
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false  # User fills this in the Render Dashboard
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      # NEXT_PUBLIC_API_BASE_URL: si el frontend corre en el MISMO contenedor
      # (monolito), déjalo vacío para usar rutas relativas (/api) que Next.js
      # reescribe al Express interno. Si el frontend es un servicio SEPARADO,
      # apunta al backend público: https://gremio-web.onrender.com/api
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      # NEXT_PUBLIC_SOCKET_URL: host del backend para Socket.IO. OBLIGATORIO si
      # el frontend es un servicio separado del backend (chat en tiempo real).
      # Ej: https://gremio-web.onrender.com  (sin /api, sin barra final)
      # Se inlaya en el build, así que debe estar en los BUILD ARGS.
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      # Google OAuth Client ID (público). En Render debe configurarse como
      # BUILD ARG del servicio (Docker) para que Next.js lo inline en el build.
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      # URL of the Media Engine service (set after deploying it)
      - key: MEDIA_ENGINE_URL
        value: https://gremio-media-engine.onrender.com
      # Shared secret used to authenticate internal calls to the Media Engine
      - key: MEDIA_ENGINE_TOKEN
        sync: false
      # PayPal (pagos de suscripciones/regalos/donaciones).
      # OBLIGATORIOS en producción: sin ellos la pasarela devuelve 503.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Producción: modo LIVE (api-m.paypal.com) y STRICT=true (rechaza pagos
      # simulados siempre). Para pruebas usa sandbox y añade PAYPAL_MODE=sandbox
      # como override en el dashboard (los valores manuales tienen prioridad).
      - key: PAYPAL_MODE
        value: "live"
      - key: PAYPAL_STRICT
        value: "true"
      # Webhook ID de PayPal (configura la URL https://TU_API/api/payments/paypal/webhook
      # en el panel de PayPal). Si no se configura, el webhook rechaza eventos (503).
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  # ===== MEDIA ENGINE (Python/FastAPI) =====
  - type: web
    name: gremio-media-engine
    env: docker
    dockerfilePath: ./media-engine/Dockerfile
    dockerContext: ./media-engine
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"
      - key: DEBUG
        value: "false"
      # Cloudflare R2 credentials (fill in Render Dashboard)
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        value: gremio-estelar-media
      - key: R2_PUBLIC_URL
        sync: false
      - key: MEDIA_ENGINE_TOKEN
        sync: false
